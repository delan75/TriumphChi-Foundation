name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit backend dependencies
        run: composer audit

      - name: Check formatting on changed PHP files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- "backend/**/*.php" | sed "s#^backend/##")

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed backend PHP files to format-check."
            exit 0
          fi

          vendor/bin/pint --test "${FILES[@]}"

      - name: Run backend tests
        run: php artisan test
